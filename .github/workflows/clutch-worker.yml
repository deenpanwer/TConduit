name: Clutch Lead Engine Worker

on:
  schedule:
    - cron: '0 */2 * * *' # Every 2 hours
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Run Lead Engine Worker
        run: npx tsx scripts/clutch-worker.ts
        env:
          LEADS_SUPABASE_URL: ${{ secrets.LEADS_SUPABASE_URL }}
          LEADS_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.LEADS_SUPABASE_SERVICE_ROLE_KEY }}
