name: Verify Email Leads

on:
  schedule:
    - cron: '*/10 * * * *' # Every 10 minutes
  workflow_dispatch:
    inputs:
      batch_size:
        description: 'Number of leads to process'
        required: true
        default: '20000'
      concurrency:
        description: 'Parallel processes'
        required: true
        default: '100'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - run: npm ci
      
      - name: Run Email Verification
        run: npx tsx scripts/verify-leads.ts
        env:
          # Match these to the exact names you just saved in GitHub Secrets
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # 3. Execution parameters
          BATCH_SIZE: ${{ github.event.inputs.batch_size || '20000' }}
          CONCURRENCY: ${{ github.event.inputs.concurrency || '100' }}
          LEADS_TABLE_NAME: 'leads'
