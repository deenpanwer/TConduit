name: Verify Email Leads

on:
  schedule:
    - cron: '0 * * * *' # Every hour
  workflow_dispatch:
    inputs:
      batch_size:
        description: 'Number of leads to process'
        required: true
        default: '2500'
      concurrency:
        description: 'Parallel processes'
        required: true
        default: '50'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - run: npm ci
      
      - name: Run Email Verification
        run: npx tsx scripts/verify-leads.ts
        env:
          # 1. Provide the prefixed variables the script expects
          # It checks secrets.LEADS_ first, then falls back to secrets.SUPABASE_
          LEADS_SUPABASE_URL: ${{ secrets.LEADS_SUPABASE_URL || secrets.SUPABASE_URL }}
          LEADS_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.LEADS_SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY }}
          
          # 2. Provide the normal variables as a safety net
          SUPABASE_URL: ${{ secrets.LEADS_SUPABASE_URL || secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.LEADS_SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY }}
          
          # 3. Execution parameters
          BATCH_SIZE: ${{ github.event.inputs.batch_size || '2500' }}
          CONCURRENCY: ${{ github.event.inputs.concurrency || '50' }}
          LEADS_TABLE_NAME: 'leads'
